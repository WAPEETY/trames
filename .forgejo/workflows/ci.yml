# Analyze + offline tests on devel and pull requests. main only moves via
# `just release`, which only tags commits that passed here; the release
# workflow just builds.
name: ci

on:
  push:
    branches: [devel]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: docker
    container:
      # Flutter + Android SDK, one tag per Flutter release. Bump with Flutter.
      image: ghcr.io/gmeligio/flutter-android:3.50.0
      # Root: the runner's workspace volume isn't writable by the image's
      # user, and tools/ci/setup.sh installs packages.
      options: --user root
    steps:
      - name: Checkout
        # No actions/checkout: the image has no Node. Full history and
        # tags are needed for the version code.
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          url="${{ github.server_url }}/${{ github.repository }}.git"
          git remote add origin "${url/:\/\//://ci:${{ github.token }}@}"
          git fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q --detach "${{ github.sha }}"
          git log -1 --oneline
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags live

