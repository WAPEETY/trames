# Pushing a tag vX.Y.Z[-alpha.N|-beta.N] (see `just release`) builds the signed
# APK and publishes it as a Forgejo release (alpha/beta marked prerelease), and
# builds the web app and deploys it to trames.realac.ci.
name: release

on:
  push:
    tags: ['v*']

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: docker
    container:
      # Flutter + Android SDK, one tag per Flutter release. Bump with Flutter.
      image: ghcr.io/gmeligio/flutter-android:3.50.0
      # Root: the runner's workspace volume isn't writable by the image's
      # user, and tools/ci/setup.sh installs packages.
      options: --user root
    steps:
      - name: Checkout
        # No actions/checkout: the image has no Node. Full history and
        # tags are needed for the version code.
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          url="${{ github.server_url }}/${{ github.repository }}.git"
          git remote add origin "${url/:\/\//://ci:${{ github.token }}@}"
          git fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q --detach "${{ github.sha }}"
          git log -1 --oneline
      - name: Setup (JDK 21, jq)
        run: tools/ci/setup.sh
      - name: Tag must be on main
        run: |
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "::error::${{ github.ref_name }} is not on main"; exit 1; }
      # No analyze/tests here: `just release` only tags commits whose `ci`
      # workflow passed.
      - run: flutter pub get
      - name: Release signing
        run: tools/ci/signing.sh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Version
        run: tools/ci/version.sh "${{ github.ref_type }}" "${{ github.ref_name }}"
      - name: Build APKs
        # One APK per ABI (smaller downloads). Flutter adds 1000 * ABI to the
        # versionCode (armeabi-v7a 1, arm64-v8a 2, x86_64 3).
        run: flutter build apk --release --split-per-abi --build-name="$VERSION_NAME" --build-number="$VERSION_CODE"
      - name: Publish
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/trames-$VERSION_NAME-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS)
          tools/ci/publish-release.sh dist/*

  web:
    runs-on: docker
    container:
      image: ghcr.io/gmeligio/flutter-android:3.50.0
      options: --user root
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          url="${{ github.server_url }}/${{ github.repository }}.git"
          git remote add origin "${url/:\/\//://ci:${{ github.token }}@}"
          git fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q --detach "${{ github.sha }}"
          git log -1 --oneline
      - name: Tag must be on main
        run: |
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "::error::${{ github.ref_name }} is not on main"; exit 1; }
      - run: flutter pub get
      - name: Build web
        # Browsers can't read the operator's GPS feed directly (no CORS
        # headers): set the CORS_PROXY repo variable (e.g.
        # https://proxy.example/?url=) for live positions on the site.
        run: flutter build web --release --dart-define=CORS_PROXY="${{ vars.CORS_PROXY }}"
      - name: Deploy (SFTP)
        # Plain sftp instead of an action: the image has no Node. Files are
        # overwritten in place; ones no longer built are left on the server.
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openssh-client >/dev/null
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo 'put -r build/web/* /sites/trames.realac.ci' > deploy.sftp
          sftp -b deploy.sftp -i ~/.ssh/deploy -P 222 \
            -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new \
            pages@192.168.188.12
